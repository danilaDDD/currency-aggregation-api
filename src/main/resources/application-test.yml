eureka:
  client:
    enabled: false

spring:
  data:
    mongodb:
      host: ${DB_HOST:localhost}
      port: ${DB_PORT:27017}
      database: ${DB_NAME_TEST:jfundTestCurrencyAggregationDB}
      password: ${DB_PASSWORD_TEST:float123}
      username: ${DB_USER_TEST:jfundAdmin}
      authentication-database: admin

app:
#  scheduler disabled for tests
  scheduler:
    enabled: ${SCHEDULER_ENABLED:false}
    handle-change-currency-values: ${HANDLE_CHANGE_CURRENCY_VALUES_CRON:* * * * * */3}
    check-aggregation-filling: ${CHECK_AGGREGATION_FILLING_CRON:* * * * * */3}
    create-candles: ${CREATE_CANDLES_CRON:* * * * * */3}
  kafka:
    server: ${KAFKA_SERVER:localhost:9092}
    currency-values-topic: ${CURRENCY_VALUES_TOPIC:jfund-currency-values}
